name: Analyze PHP code with PHPStan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpstan:
    name: Run PHPStan at maximum level
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.ref }}
      - name: Set up PHP for Axolotl-PM
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: 8.2
          install-path: ${{ github.workspace }}/bin
          pm-version-major: 5
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Download provider PHAR dependencies
        run: |
          wget -O vendor/BedrockEconomy.phar https://poggit.pmmp.io/r/230746/BedrockEconomy.phar
          wget -O vendor/EconomyAPI.phar https://poggit.pmmp.io/r/153507/EconomyAPI.phar
          wget -O vendor/SimpleEconomy.phar https://poggit.pmmp.io/r/262879/SimpleEconomy.phar
      - name: Run PHPStan analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress
